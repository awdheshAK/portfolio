  <text x="1550" y="1050" text-anchor="end" dominant-baseline="auto" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.38" letter-spacing="1.5">MJO — Sustainability Visual — Placeholder</text>
